name: Push relay
# The phone app's push relay (push-relay/) is typechecked in Fast checks (tsconfig.json), but its
# tests live outside the folders scripts/ci-tests.ts collects, so they run here. A relay change
# runs them; nothing else can break them, as the Worker imports nothing from the rest of the repo
# (web-push, which its tests sign pushes with, is in bun.lock).
on:
  pull_request:
    paths:
      - 'push-relay/**'
      - 'bun.lock'
      - '.github/workflows/push-relay.yml'
  push:
    branches: [main]
    paths:
      - 'push-relay/**'
      - 'bun.lock'
      - '.github/workflows/push-relay.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: push-relay-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Push relay tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - run: bun install --frozen-lockfile
      - run: bun test ./push-relay
