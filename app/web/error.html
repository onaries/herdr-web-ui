<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ovis</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main>
    <h1 data-ko="PC에 연결할 수 없습니다">Can't reach your PC</h1>
    <p id="what">The app could not open it.</p>
    <p class="error" id="reason"></p>
    <p data-ko="PC가 켜져 있는지, 거기서 Ovis가 실행 중인지, 이 휴대폰이 PC에 닿을 수 있는지(Tailscale이면 둘 다 같은 tailnet에 있는지) 확인하세요.">Check that the PC is on, that Ovis runs there, and that this phone can reach it (on Tailscale, both in the same tailnet).</p>
    <div class="row">
      <button type="button" class="primary" id="retry" data-ko="다시 시도">Try again</button>
      <button type="button" id="change" data-ko="PC 바꾸기">Change PC</button>
    </div>
  </main>
  <!-- self-contained: on Android, Capacitor serves error.html alone while a PC is open (no shell.js
       or shell.css beside it), so app/scripts/build-web.ts puts shell.css in and the script is inline,
       with its own copy of shell.js's Korean switch. There Capacitor's bridge is not on this page
       either: MainActivity's HerdrErrorPage listener, open to this origin only, answers instead. -->
  <script type="module">
    const korean = /^ko\b/i.test(navigator.language ?? "");
    if (korean) {
      document.documentElement.lang = "ko";
      for (const element of document.querySelectorAll("[data-ko]")) element.textContent = element.dataset.ko;
    }
    const shell = (method, options = {}) => window.Capacitor.nativePromise("HerdrShell", method, options);
    const android = window.HerdrErrorPage;
    const state = android
      ? await new Promise((resolve) => { android.onmessage = (event) => resolve({ last: event.data, failure: "" }); android.postMessage("last"); })
      : await shell("getState");
    document.getElementById("what").textContent = state.last
      ? (korean ? `앱이 ${state.last}을(를) 열지 못했습니다.` : `The app could not open ${state.last}.`)
      : (korean ? "앱이 PC를 열지 못했습니다." : "The app could not open it.");
    document.getElementById("reason").textContent = state.failure ?? "";
    document.getElementById("retry").addEventListener("click", () => void (android ? android.postMessage("retry") : shell("retry")));
    document.getElementById("change").addEventListener("click", () => void (android ? android.postMessage("changePc") : shell("disconnect")));
  </script>
</body>
</html>
