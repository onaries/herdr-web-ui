[package]
name = "ovis-pty-sidecar"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Runs one command on a pseudo-terminal for the Ovis server (same protocol as server/pty/pty-host.mjs)"

[[bin]]
name = "ovis-pty-sidecar"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.dev]
panic = "abort"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
